<script>
// All four severities carry a contractual initial-response commitment, so
// severity no longer decides boundness. P1/P2 stay separable as the headline
// band because that is the number customers challenge in a QBR.
const STATUS = {
  P1: { color: 'var(--status-critical)', label: 'P1 · Critical' },
  P2: { color: 'var(--status-serious)',  label: 'P2 · Serious' },
  P3: { color: 'var(--status-warning)',  label: 'P3 · Warning' },
  P4: { color: 'var(--status-good)',     label: 'P4 · Minor' },
};
const SEV_ORDER = ['P1','P2','P3','P4'];
const SEV_RANK = { P1: 1, P2: 2, P3: 3, P4: 4 };
const HEADLINE_SEVS = ['P1','P2'];
const SEV_LABEL_BY_KEY = { P1: 'Sev 1', P2: 'Sev 2', P3: 'Sev 3', P4: 'Sev 4' };
const EMPTY_ROLLUP = { total: 0, bound: 0, scored: 0, met: 0, breached: 0, noMilestone: 0, pct: null };
const HEALTH_META = {
  'Healthy': { color: 'var(--status-good)', label: 'Healthy' },
  'Low Activity': { color: 'var(--text-muted)', label: 'Low activity' },
  'At Risk': { color: 'var(--status-critical)', label: 'At risk' },
};
// accounts/*.json is an external contract: any field may be missing, null, or
// the wrong type. Everything below coerces rather than throws, so one bad
// account degrades to an empty row instead of blanking the whole report.
const asObject = (v) => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
const asArray = (v) => Array.isArray(v) ? v : [];
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const accountName = (d) => asObject(asObject(d).customer).name || asObject(d)._file || 'Unnamed account';
const fmt = (n) => num(n).toLocaleString('en-US');
const fmt1 = (n) => num(n).toLocaleString('en-US', { maximumFractionDigits: 1 });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseDurationHours(s) {
  if (!s || s === 'Open') return null;
  let m = /^(\d+)d (\d+)h$/.exec(s);
  if (m) return parseInt(m[1], 10) * 24 + parseInt(m[2], 10);
  m = /^(\d+(?:\.\d+)?)h$/.exec(s);
  if (m) return parseFloat(m[1]);
  m = /^(\d+(?:\.\d+)?)m$/.exec(s);
  if (m) return parseFloat(m[1]) / 60;
  return null;
}
function sevKey(s) {
  const m = String(s || '').match(/([1-4])/);
  return m ? ('P' + m[1]) : null;
}

// ---------- Tooltip ----------
const tt = document.getElementById('tooltip');
function showTooltip(evt, title, listHtml) {
  tt.innerHTML = '<div class="tt-title">' + title + '</div>' + (listHtml ? '<div class="tt-list">' + listHtml + '</div>' : '');
  tt.classList.add('show');
  moveTooltip(evt);
}
function moveTooltip(evt) {
  const pad = 16;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  const rect = tt.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 8) x = evt.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - 8) y = evt.clientY - rect.height - pad;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}
function hideTooltip() { tt.classList.remove('show'); }
function wireTooltips(root) {
  root.querySelectorAll('[data-tt-title]').forEach(row => {
    row.addEventListener('mouseenter', (e) => showTooltip(e, row.dataset.ttTitle, row.dataset.ttList));
    row.addEventListener('mousemove', moveTooltip);
    row.addEventListener('mouseleave', hideTooltip);
  });
}

// ---------- Data loading ----------
async function fetchAccountFileList() {
  const res = await fetch('accounts/', { cache: 'no-cache' });
  if (!res.ok) throw new Error('Cannot list accounts/ (HTTP ' + res.status + ')');
  const html = await res.text();
  const files = [...html.matchAll(/href="([^"]+\.json)"/g)].map(m => decodeURIComponent(m[1]));
  if (!files.length) throw new Error('accounts/ has no .json files');
  return files.sort();
}
async function fetchAllAccounts() {
  const files = await fetchAccountFileList();
  // A file that 404s or holds unparseable JSON is dropped with a console note —
  // it must not take the rest of the portfolio down with it.
  const loaded = await Promise.all(files.map(async f => {
    try {
      const r = await fetch('accounts/' + f, { cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = asObject(await r.json());
      data._file = f;
      return data;
    } catch (err) {
      console.warn('accounts/' + f + ' skipped: ' + err.message);
      return null;
    }
  }));
  const accounts = loaded.filter(Boolean);
  if (!accounts.length) throw new Error('No readable .json files in accounts/');
  // Sidecar writes both {slug}.json and {slug}-{quarter}.json — keep one row per customer.
  const byName = new Map();
  for (const d of accounts) {
    const name = accountName(d);
    const prev = byName.get(name);
    const score = (d._meta && d._meta.lastUpdated) || '';
    const prevScore = (prev && prev._meta && prev._meta.lastUpdated) || '';
    const preferStable = !/q[1-4]-fy\d/i.test(d._file);
    const prevStable = prev ? !/q[1-4]-fy\d/i.test(prev._file) : false;
    if (!prev || (preferStable && !prevStable) || score > prevScore) {
      byName.set(name, d);
    }
  }
  return [...byName.values()];
}

// ---------- SLA scoring: sidecar block first, client-side recompute second ----------
// `sourceReview.slaScoring` is what sf-sync now precomputes, including the
// contractual targets and the tier they depend on. Older pulls and the
// synthetic fixtures predate it, so every reader below falls back to the
// per-ticket recomputation rather than reporting zeros.
function rollupFrom(raw) {
  const o = asObject(raw);
  const present = ['total','bound','scored','met','breached'].some(k => o[k] != null);
  if (!present) return null;
  const scored = num(o.scored), met = num(o.met);
  return {
    total: num(o.total), bound: num(o.bound), scored, met,
    breached: num(o.breached), noMilestone: num(o.noMilestone),
    pct: o.pct == null ? (scored ? Math.round(100 * met / scored) : null) : Math.round(num(o.pct)),
  };
}
function sumRollups(rows) {
  const agg = { total: 0, bound: 0, scored: 0, met: 0, breached: 0, noMilestone: 0 };
  rows.forEach(r => { const o = asObject(r); Object.keys(agg).forEach(k => { agg[k] += num(o[k]); }); });
  agg.pct = agg.scored ? Math.round(100 * agg.met / agg.scored) : null;
  return agg;
}
// A tier of null is a finding, not a blank: Sev 1 is 15 min on OpsCare Plus and
// 30 min on OpsCare, so adherence without a tier cannot be validated at all.
function readSubscription(d, raw) {
  const s = asObject(raw);
  const support = asObject(asObject(d).support);
  const str = (v) => (typeof v === 'string' && v.trim()) ? v.trim() : null;
  return {
    // customer.tier is the commercial segment (Enterprise / Growth) and is a
    // different thing entirely — never read it as the subscription tier.
    tier: str(s.tier) || str(support._subscriptionTier),
    // LabCare / Custom are recognized Salesforce levels with no published
    // contract targets — shown as a label when tier is null.
    supportLevel: str(s.supportLevel),
    confidence: str(s.confidence) || 'unknown',
    source: str(s.source),
    conflict: s.conflict === true,
    scope: str(s.scope),
    reference: str(s.reference),
    documentedTargetMins: asObject(s.documentedTargetMins),
    reported: Object.keys(s).length > 0,
  };
}
function readMismatches(raw, account) {
  return asArray(raw).map(m => {
    const r = asObject(m);
    const live = r.liveTargetMins == null ? null : num(r.liveTargetMins);
    const doc = r.documentedTargetMins == null ? null : num(r.documentedTargetMins);
    if (live == null || doc == null || live === doc) return null;
    return {
      account, severity: String(r.severity ?? ''), sevKey: sevKey(r.severity),
      tier: (typeof r.tier === 'string' && r.tier.trim()) ? r.tier.trim() : null,
      liveTargetMins: live, documentedTargetMins: doc, cases: num(r.cases),
      sampleCaseNumbers: asArray(r.sampleCaseNumbers).map(String),
    };
  }).filter(Boolean);
}
function readSlaScoring(d) {
  const raw = asObject(asObject(asObject(d).sourceReview).slaScoring);
  const headline = rollupFrom(raw.headline);
  const overall = rollupFrom(raw.overall);
  // A block missing either rollup is treated as absent — a half-read sidebar
  // figure is worse than the recomputation it would replace.
  if (!headline || !overall) return null;
  const rawBySev = asObject(raw.bySeverity);
  const bySev = {};
  SEV_ORDER.forEach(k => {
    const row = asObject(rawBySev[SEV_LABEL_BY_KEY[k]]);
    bySev[k] = Object.assign({}, EMPTY_ROLLUP, rollupFrom(row) || {}, {
      contractTargetMins: row.contractTargetMins == null ? null : num(row.contractTargetMins),
      liveTargetMinsObserved: asArray(row.liveTargetMinsObserved).filter(v => v != null).map(num),
    });
  });
  return {
    headline, overall, bySev,
    basis: raw.basis || 'initial response',
    scope: raw.scope || 'all severities (Sev 1–4)',
    headlineScope: raw.headlineScope || 'Sev 1–2',
    subscriptionRaw: raw.subscription,
    unknownSeverity: num(raw.unknownSeverity),
    mismatchesRaw: raw.targetMismatches,
    warnings: asArray(raw.warnings).filter(w => typeof w === 'string'),
  };
}

// ---------- Per-account computed view ----------
function computeAccountStats(d) {
  const sr = asObject(asObject(d).sourceReview);
  const tickets = asArray(sr.ticketDetail).map(raw => {
    const row = asObject(raw);
    // SLA severity = severity when the commitment applied, so `openedAs` wins.
    // `severity` is only a fallback for curated dumps that omit it — the sidecar
    // writes severity-at-open into both, but a hand-built file may carry the
    // current severity there, and tickets routinely step down after response.
    const slaSev = sevKey(row.openedAs) || sevKey(row.severity) || 'P4';
    // Every severity carries an initial-response commitment, so only an
    // explicit slaBound:false takes a row out of the scored set. Older payloads
    // set that flag on Sev 3/4, which keeps them excluded exactly as before.
    const slaBound = row.slaBound == null ? true : !!row.slaBound;
    let slaBreach = row.slaBreach ?? null;
    if (!slaBound) slaBreach = null;
    return {
      ...row,
      slaSev,
      slaBound,
      // Derived from slaSev rather than read from row.slaHeadline, so the
      // headline rollup and the severity column can never disagree.
      slaHeadline: HEADLINE_SEVS.includes(slaSev),
      hours: parseDurationHours(row.duration),
      slaBreach,
      slaTargetMins: row.slaTargetMins ?? null,
      slaActualMins: row.slaActualMins ?? null,
      slaTargetSource: row.slaTargetSource ?? null,
      slaContractTargetMins: row.slaContractTargetMins ?? null,
      slaTargetMismatch: slaBound ? (row.slaTargetMismatch ?? null) : null,
    };
  });
  const slaTotals = { P1:0, P2:0, P3:0, P4:0 };
  tickets.forEach(t => { slaTotals[t.slaSev]++; });
  const resBySev = { P1:[],P2:[],P3:[],P4:[] };
  tickets.forEach(t => { if (t.hours != null && t.status === 'Closed') resBySev[t.slaSev].push(t.hours); });
  const resStats = {};
  SEV_ORDER.forEach(k => {
    const vals = resBySev[k];
    resStats[k] = vals.length ? {
      count: vals.length,
      avg: vals.reduce((a,b)=>a+b,0) / vals.length,
      max: Math.max(...vals),
    } : { count: 0 };
  });
  // Client-side recomputation — the fallback for any payload without a
  // slaScoring block, and the source of the per-ticket rows either way.
  const derivedBySev = {};
  SEV_ORDER.forEach(k => {
    const rows = tickets.filter(t => t.slaSev === k);
    const bound = rows.filter(t => t.slaBound);
    const scored = bound.filter(t => t.slaBreach != null);
    const met = scored.filter(t => t.slaBreach === false).length;
    const live = [...new Set(bound.map(t => t.slaTargetMins).filter(v => v != null).map(num))];
    derivedBySev[k] = {
      total: rows.length, bound: bound.length, scored: scored.length, met,
      breached: scored.length - met,
      // A case with no usable milestone leaves the denominator; it is never
      // counted as a pass.
      noMilestone: bound.length - scored.length,
      pct: scored.length ? Math.round(100 * met / scored.length) : null,
      contractTargetMins: null,
      liveTargetMinsObserved: live.sort((a,b) => a - b),
    };
  });

  const scoring = readSlaScoring(d);
  const subscription = readSubscription(d, scoring && scoring.subscriptionRaw);
  const name = accountName(d);
  const sla = scoring ? {
    source: 'sidecar',
    headline: scoring.headline,
    all: scoring.overall,
    bySev: scoring.bySev,
    unknownSeverity: scoring.unknownSeverity,
    mismatches: readMismatches(scoring.mismatchesRaw, name),
    warnings: scoring.warnings,
    basis: scoring.basis, scope: scoring.scope, headlineScope: scoring.headlineScope,
    subscription,
  } : {
    source: 'derived',
    headline: sumRollups(HEADLINE_SEVS.map(k => derivedBySev[k])),
    all: sumRollups(SEV_ORDER.map(k => derivedBySev[k])),
    bySev: derivedBySev,
    unknownSeverity: 0,
    // Target validation needs the contractual table, which only the sidecar
    // holds. A recomputed account reports adherence but not mismatches.
    mismatches: [],
    warnings: [],
    basis: 'initial response', scope: 'all severities (Sev 1–4)', headlineScope: 'Sev 1–2',
    subscription,
  };
  return { tickets, slaTotals, resStats, sla };
}

// ---------- Portfolio aggregation ----------
function accountSummary(d) {
  const sr = asObject(asObject(d).sourceReview);
  const counts = asObject(sr.ticketCounts);
  const av = computeAccountStats(d);
  return {
    file: asObject(d)._file, name: accountName(d),
    total: num(counts.total), open: num(counts.open), closed: num(counts.closed),
    slaTotals: av.slaTotals,
    // Sort keys stay flat: `sla*` is the Sev 1–2 headline, `slaAll*` the wider
    // measure. The two are never folded into one column.
    slaPct: av.sla.headline.pct,
    slaBreached: av.sla.headline.breached,
    slaAllPct: av.sla.all.pct,
    slaAllBreached: av.sla.all.breached,
    tier: av.sla.subscription.tier,
    tierSort: av.sla.subscription.tier || 'zz-unknown',
    health: asObject(asObject(d).health).status ?? 'Unknown',
    _sla: av.sla, _stats: av, _raw: asObject(d),
  };
}

function computePortfolio(accounts) {
  const list = accounts.map(d => {
    try {
      return accountSummary(d);
    } catch (err) {
      // Last resort for a shape nothing above anticipated: an empty row keyed on
      // the filename, so this account degrades and the rest still render.
      console.warn('Degraded row for ' + (asObject(d)._file || 'unknown account') + ': ' + err.message);
      return accountSummary({ _file: asObject(d)._file });
    }
  });
  const portfolioTotal = list.reduce((s,a) => s + a.total, 0);
  const portfolioOpen = list.reduce((s,a) => s + a.open, 0);
  const portfolioClosed = list.reduce((s,a) => s + a.closed, 0);
  const slaTotals = { P1:0,P2:0,P3:0,P4:0 };
  list.forEach(a => SEV_ORDER.forEach(k => { slaTotals[k] += a.slaTotals[k]; }));
  const healthCounts = {};
  list.forEach(a => { healthCounts[a.health] = (healthCounts[a.health] || 0) + 1; });

  const allTickets = [];
  list.forEach(a => a._stats.tickets.forEach(t => allTickets.push({ ...t, account: a.name, file: a.file })));

  const resBySev = { P1:[],P2:[],P3:[],P4:[] };
  allTickets.forEach(t => { if (t.hours != null && t.status === 'Closed') resBySev[t.slaSev].push(t); });
  const resolutionStats = {};
  SEV_ORDER.forEach(k => {
    const vals = resBySev[k].map(t => t.hours);
    resolutionStats[k] = vals.length ? {
      count: vals.length,
      avg_hours: vals.reduce((a,b)=>a+b,0) / vals.length,
      median_hours: [...vals].sort((a,b)=>a-b)[Math.floor(vals.length/2)],
      max_hours: Math.max(...vals),
    } : { count: 0, avg_hours: null, median_hours: null, max_hours: null };
  });

  // Portfolio totals sum each account's own rollup rather than rescoring the
  // pooled tickets, so a sidecar-scored account keeps its precomputed figures
  // even when it sits next to a recomputed one.
  const slaBySev = {};
  SEV_ORDER.forEach(k => {
    slaBySev[k] = sumRollups(list.map(a => a._sla.bySev[k]));
    const contract = [...new Set(list.map(a => a._sla.bySev[k].contractTargetMins).filter(v => v != null))];
    slaBySev[k].contractTargetMins = contract.length === 1 ? contract[0] : null;
    slaBySev[k].liveTargetMinsObserved = [...new Set(
      list.flatMap(a => asArray(a._sla.bySev[k].liveTargetMinsObserved))
    )].sort((a,b) => a - b);
  });
  const slaHeadline = sumRollups(list.map(a => a._sla.headline));
  const slaAll = sumRollups(list.map(a => a._sla.all));
  const slaBreaches = allTickets.filter(t => t.slaBound && t.slaBreach === true);
  const mismatches = list.flatMap(a => a._sla.mismatches);
  const tierCounts = {};
  let tierUnknown = 0;
  list.forEach(a => {
    if (a.tier) tierCounts[a.tier] = (tierCounts[a.tier] || 0) + 1;
    else tierUnknown++;
  });
  const derivedAccounts = list.filter(a => a._sla.source === 'derived').length;

  const openTickets = allTickets.filter(t => t.status === 'Open');
  const longestResolutions = allTickets.filter(t => t.hours != null && t.status === 'Closed')
    .sort((a,b) => b.hours - a.hours).slice(0, 10);

  const BUCKETS = [
    ['Upgrade / Migration / Lifecycle', ['upgrad','migrat','lifecycle','version']],
    ['License / Procurement', ['licens','procure','fulfillment']],
    ['Stability / Reliability', ['stabilit','reliab','health','resource exhaust','crash']],
    ['Storage / Disk / Filesystem', ['storage','disk','filesystem','permission']],
    ['Account / Access / Identity', ['account admin','access manage','identity','onboard','personnel']],
    ['Networking', ['network','interlock','node integration','orchestration']],
    ['Certificate Management', ['certificat']],
  ];
  const themeBuckets = BUCKETS.map(([label, kws]) => {
    const accs = list.filter(a => {
      const text = asArray(asObject(a._raw.sourceReview).recurringThemes).join(' ').toLowerCase();
      return kws.some(kw => text.includes(kw));
    }).map(a => a.name);
    return { label, accountCount: accs.length, accounts: accs.sort() };
  }).sort((a,b) => b.accountCount - a.accountCount);

  return {
    accounts: list.sort((a,b) => (b.slaBreached - a.slaBreached) || (b.total - a.total)),
    portfolio: { total: portfolioTotal, open: portfolioOpen, closed: portfolioClosed, slaTotals, healthCounts },
    resolutionStats,
    sla: {
      headline: slaHeadline,
      all: slaAll,
      bySev: slaBySev,
      mismatches: mismatches.sort((a,b) =>
        (SEV_RANK[a.sevKey] || 9) - (SEV_RANK[b.sevKey] || 9) ||
        (a.account || '').localeCompare(b.account || '')),
      tierCounts, tierUnknown, derivedAccounts,
      // Only the contract reference is portfolio-wide; tiers are per account.
      subscription: { reference: list.map(a => a._sla.subscription.reference).find(Boolean) || null },
      // Breaches are row-level and stay pooled. Headline severities lead the
      // list so a Sev 3 backlog cannot bury a Sev 1 miss.
      breaches: slaBreaches.sort((a,b) =>
        (SEV_RANK[a.slaSev] || 9) - (SEV_RANK[b.slaSev] || 9) ||
        (a.account || '').localeCompare(b.account || '')),
      headlineBreaches: slaBreaches.filter(t => t.slaHeadline).length,
    },
    openTickets, longestResolutions, themeBuckets,
  };
}

// ---------- Shared render helpers ----------
function sevBarListHtml(totals) {
  const max = Math.max(...SEV_ORDER.map(k => totals[k]), 1);
  return SEV_ORDER.map(k => {
    const v = totals[k];
    const pct = Math.max((v / max) * 100, v > 0 ? 2 : 0);
    return '<div class="bar-row">' +
      '<div class="bar-row-label"><span class="sev-dot" style="background:' + STATUS[k].color + '"></span>' + STATUS[k].label + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + STATUS[k].color + '"></div></div>' +
      '<div class="bar-value">' + fmt(v) + '</div></div>';
  }).join('');
}
function sevStackHtml(totals) {
  const total = SEV_ORDER.reduce((s,k) => s + totals[k], 0) || 1;
  return '<div class="mini-stack">' + SEV_ORDER.map(k => {
    const w = (totals[k] / total) * 100;
    return w > 0 ? '<span style="width:' + w + '%; background:' + STATUS[k].color + '" title="' + STATUS[k].label + ': ' + totals[k] + '"></span>' : '';
  }).join('') + '</div>';
}
function healthChipHtml(health) {
  const hm = HEALTH_META[health] || { color: 'var(--text-muted)', label: health };
  return '<span class="health-chip"><span class="health-dot" style="background:' + hm.color + '"></span>' + esc(hm.label) + '</span>';
}
function fmtMins(m) {
  if (m == null || m === '') return '—';
  const n = Number(m);
  if (Number.isNaN(n)) return '—';
  if (n < 60) return Math.round(n) + 'm';
  if (n < 1440) return fmt1(n / 60) + 'h';
  return fmt1(n / 1440) + 'd';
}
function pctText(v) { return v == null ? '—' : v + '%'; }
function sevDotHtml(k) {
  const color = (STATUS[k] || {}).color || 'var(--text-muted)';
  return '<span class="sev-dot" style="background:' + color + '; display:inline-block; margin-right:6px;"></span>';
}
// A tier that could not be resolved is rendered loudly rather than left blank:
// the Sev 1 window is 15 min on OpsCare Plus and 30 on OpsCare, so an unknown
// tier means the adherence beside it has not been validated against anything.
function tierChipHtml(sub, opts) {
  opts = opts || {};
  const s = asObject(sub);
  const chip = (cls, text, title) =>
    '<span class="tier-chip ' + cls + '" title="' + esc(title) + '"><span class="tier-dot"></span>' + text + '</span>';
  if (s.conflict) {
    return chip('tier-unknown', 'Tier unresolved' + (opts.terse ? '' : ' — conflicting signals'),
      'Salesforce returned more than one tier signal' + (s.scope ? ' across ' + s.scope : '') +
      '. Not guessing: assuming the higher tier would hide breaches.');
  }
  if (!s.tier) {
    if (s.supportLevel) {
      return chip('tier-unknown',
        esc(s.supportLevel) + (opts.terse ? '' : ' — no published SLA targets'),
        esc(s.supportLevel) + ' is a known Salesforce support level, but it has no ' +
        'initial-response windows on the Service Level Management page. Adherence is ' +
        'measured against whatever Salesforce enforced and is not validated against ' +
        'the OpsCare / OpsCare Plus contract table.' +
        (s.source ? ' Derived from ' + s.source + '.' : ''));
    }
    return chip('tier-unknown', 'Tier unknown' + (opts.terse ? '' : ' — targets unvalidated'),
      (s.reported
        ? 'No entitlement named a subscription tier.'
        : 'This payload predates tier detection, so no tier was reported.') +
      ' Adherence is measured against whatever Salesforce enforced and is not checked against the contract.');
  }
  const qual = (!opts.terse && s.confidence && s.confidence !== 'high')
    ? ' <span class="tier-qual">· ' + esc(s.confidence) + ' confidence</span>' : '';
  return chip('', esc(s.tier) + qual,
    (s.source ? 'Derived from ' + s.source : 'Subscription tier') +
    ' · confidence ' + (s.confidence || 'unknown'));
}
// Adherence by severity, with the headline band marked. `excluded` is the gap
// between bound and scored — cases with no usable milestone, which leave the
// denominator rather than counting as a pass.
function adherenceBySevHtml(sla) {
  const body = SEV_ORDER.map(k => {
    const r = asObject(sla.bySev[k]);
    const excluded = Math.max(0, num(r.bound) - num(r.scored));
    const tag = HEADLINE_SEVS.includes(k)
      ? '<span class="band-tag band-headline">headline</span>'
      : '<span class="band-tag">all-severity only</span>';
    const bar = r.pct == null
      ? '<span style="color:var(--text-muted)">not scored</span>'
      : '<span class="inline-bar bar-track"><span class="bar-fill" style="width:' + Math.max(r.pct, 2) + '%; background:' + STATUS[k].color + '"></span></span>' +
        '<span class="num">' + r.pct + '%</span>';
    const targets = [];
    if (r.contractTargetMins != null) targets.push('contract ' + fmtMins(r.contractTargetMins));
    const live = asArray(r.liveTargetMinsObserved);
    if (live.length) targets.push('enforced ' + live.map(fmtMins).join(', '));
    return '<tr>' +
      '<td>' + sevDotHtml(k) + STATUS[k].label + tag + '</td>' +
      '<td>' + bar + '</td>' +
      '<td class="num">' + fmt(r.scored) + '</td>' +
      '<td class="num">' + fmt(r.met) + '</td>' +
      '<td class="num">' + fmt(r.breached) + '</td>' +
      '<td class="num">' + fmt(excluded) + '</td>' +
      '<td>' + (targets.length ? esc(targets.join(' · ')) : '<span style="color:var(--text-muted)">—</span>') + '</td>' +
      '</tr>';
  }).join('');
  return '<div class="table-scroll"><table class="data-table"><thead><tr>' +
    '<th>Severity at open</th><th>Initial-response adherence</th><th class="num">Scored</th>' +
    '<th class="num">Met</th><th class="num">Breached</th><th class="num">Excluded</th><th>Response target</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
}
function mismatchPanelHtml(rows, opts) {
  opts = opts || {};

          '</tr>').join('')}</tbody></table>

      </div>`;
}
function methodologyHtml(sla) {
  const s = asObject(asObject(sla).subscription);
  const ref = s.reference ? ' Documented targets come from ' + esc(s.reference) + '.' : '';
  return `
      <div class="footnote">
        <h3>Methodology &amp; data notes</h3>
        <ul>
          <li><strong>What we score:</strong> the <strong>initial response</strong> (First Response milestone) on <strong>all four severities</strong>. Sev 3 and Sev 4 carry real 2-to-8-hour commitments and are scored, not skipped.</li>
          <li><strong>Headline vs. all-severity:</strong> the headline percentage covers <strong>P1/P2 only</strong>, because that is the commitment customers challenge. The all-severity figure covers P1–P4. They are different denominators and will normally differ — neither substitutes for the other.</li>
          <li><strong>Targets depend on the subscription tier:</strong> a Sev 1 initial response is 15 minutes on OpsCare Plus and 30 on OpsCare. Where the tier could not be determined the report says so, and adherence there is measured against whatever Salesforce enforced, unvalidated.${ref}</li>
          <li><strong>Target mismatches:</strong> where the enforced window differs from the documented one, both are shown and neither is silently preferred.</li>
          <li><strong>No usable milestone:</strong> a case that carries no First Response milestone is <strong>excluded from the denominator</strong> — it is never counted as a pass.</li>
          <li><strong>Severity at open:</strong> taken from Case history on <code>Severity_Level__c</code> when available; otherwise the Case field at pull time. Severity changes after open are normal resolve/verify workflow and are not a finding.</li>
          <li><strong>What we ignore:</strong> WatchDog / Next Update milestones and the separate periodic-update commitment, which is a real obligation but is not scored here.</li>
          <li><strong>Source:</strong> <code>accounts/*.json</code> — the sidecar's <code>sourceReview.slaScoring</code> block where present, otherwise recomputed in-browser from <code>ticketDetail</code>. Recomputed accounts have no contractual target to compare against, so tier validation and mismatch detection are unavailable for them.</li>
        </ul>
      </div>`;
}

// The column is headed "First response", so naming the milestone is only
// informative when the row was scored against a different one.
function slaMilestoneNote(t) {
  const name = t.slaMilestone;
  if (!name || String(name) === 'First Response') return '';
  return ' <span style="color:var(--text-muted);font-size:12px">· ' + esc(name) + '</span>';
}
// Flags a row whose enforced window differs from the documented one, and a row
// scored against the contract because the milestone carried no target of its own.
function slaTargetNote(t) {
  if (t.slaTargetMismatch === true && t.slaContractTargetMins != null) {
    return ' <span class="reclass-flag" title="' + esc('Salesforce enforced ' + fmtMins(t.slaTargetMins) +
      '; the contract documents ' + fmtMins(t.slaContractTargetMins) + '.') + '">≠ contract ' +
      fmtMins(t.slaContractTargetMins) + '</span>';
  }
  if (t.slaTargetSource === 'contract') {
    return ' <span style="color:var(--text-muted);font-size:12px" title="' +
      esc('The milestone carried no target, so the documented contractual window is shown.') + '">· contract target</span>';
  }
  return '';
}
function slaLabel(t) {
  if (!t.slaBound) return '<span style="color:var(--text-muted)">n/a</span>';
  if (t.slaBreach == null) return '<span style="color:var(--text-muted)">no milestone · not scored</span>';
  if (t.slaBreach) {
    return '<span class="reclass-flag">Breached</span>' +
      (t.slaTargetMins != null ? ' <span style="color:var(--text-muted);font-size:12px">target ' + fmtMins(t.slaTargetMins) + '</span>' : '') +
      slaTargetNote(t) + slaMilestoneNote(t);
  }
  return '<span style="color:var(--status-good);font-weight:600">Met</span>' +
    (t.slaActualMins != null || t.slaTargetMins != null
      ? ' <span style="color:var(--text-muted);font-size:12px">' + fmtMins(t.slaActualMins) + ' / ' + fmtMins(t.slaTargetMins) + '</span>'
      : '') +
    slaTargetNote(t) + slaMilestoneNote(t);
}
function resBarListHtml(resStats) {
  const maxAvg = Math.max(...SEV_ORDER.map(k => resStats[k].avg_hours || resStats[k].avg || 0));
  return SEV_ORDER.map(k => {
    const r = resStats[k];
    const avg = r.avg_hours ?? r.avg;
    if (!r.count) {
      return '<div class="bar-row"><div class="bar-row-label"><span class="sev-dot" style="background:' + STATUS[k].color + '"></span>' + STATUS[k].label + '</div><div class="bar-track"></div><div class="bar-value">no closed cases</div></div>';
    }
    const pct = maxAvg > 0 ? Math.max((avg / maxAvg) * 100, 2) : 2;
    const avgDays = avg / 24;
    return '<div class="bar-row"><div class="bar-row-label"><span class="sev-dot" style="background:' + STATUS[k].color + '"></span>' + STATUS[k].label + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%; background:' + STATUS[k].color + '"></div></div>' +
      '<div class="bar-value">' + fmt1(avgDays) + 'd avg</div></div>';
  }).join('');
}
function daysAge(created, asOf) {
  const c = new Date(String(created ?? '') + 'T00:00:00Z');
  if (Number.isNaN(c.getTime())) return null;
  const a = asOf ? new Date(asOf) : new Date();
  return Math.max(0, Math.round((a - c) / 86400000));
}
function ageSuffix(t) {
  const age = t.status === 'Open' ? daysAge(t.created) : null;
  return age == null ? '' : ' · ' + age + 'd';
}
function ticketRowHtml(t, opts) {
  opts = opts || {};
  return '<tr>' +
    (opts.showAccount ? '<td>' + esc(t.account) + '</td>' : '') +
    '<td class="case-num">' + esc(t.caseNumber) + '</td>' +
    '<td class="subject-cell"><div class="subj">' + esc(t.subject) + '</div>' +
      (opts.full ? '<div class="narrative"><strong>Issue:</strong> ' + esc(t.issue) + '</div>' + (t.resolution ? '<div class="narrative"><strong>Resolution:</strong> ' + esc(t.resolution) + '</div>' : '') : '') +
    '</td>' +
    '<td>' + esc(t.created) + '</td>' +
    '<td>' + esc(t.status) + ageSuffix(t) + '</td>' +
    '<td>' + sevDotHtml(t.slaSev) + t.slaSev + '</td>' +
    '<td>' + slaLabel(t) + '</td>' +
    '</tr>';
}

    '</tr>';
}
function wireSortableTable(tableId, rows, rowRenderFn, defaultKey, defaultDir) {
  const table = document.getElementById(tableId);
  let sortState = { key: defaultKey, dir: defaultDir };
  function render() {
    const sorted = [...rows].sort((a,b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (typeof av === 'string') return av.localeCompare(bv) * sortState.dir;
      return (av - bv) * sortState.dir;
    });
    table.querySelector('tbody').innerHTML = sorted.map(rowRenderFn).join('');
    table.querySelectorAll('th[data-sort]').forEach(th => {
      th.classList.toggle('sorted', th.dataset.sort === sortState.key);
      const arrow = th.querySelector('.arrow');
      if (arrow) arrow.textContent = (th.dataset.sort === sortState.key && sortState.dir === 1) ? '▴' : '▾';
    });
  }
  table.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      sortState.dir = (sortState.key === key) ? -sortState.dir : -1;
      sortState.key = key;
      render();
    });
  });
  render();
}

// ---------- Router ----------
function showState(msg) {
  document.getElementById('app').innerHTML = '<div class="state-msg">' + msg + '</div>';
}
let cachedAccounts = null;
async function route() {
  const hash = location.hash.slice(1);
  try {
    if (hash.startsWith('account/')) {
      const file = decodeURIComponent(hash.slice('account/'.length));
      showState('Loading account…');
      const res = await fetch('accounts/' + file, { cache: 'no-cache' });
      if (!res.ok) throw new Error('Could not load ' + file);
      const data = asObject(await res.json());
      data._file = file;
      renderAccountDetail(data);
    } else {
      showState('Loading portfolio — reading accounts/*.json…');
      if (!cachedAccounts) cachedAccounts = await fetchAllAccounts();
      renderPortfolio(computePortfolio(cachedAccounts));
    }
    window.scrollTo(0, 0);
  } catch (err) {
    showState(
      '<strong>Could not load data.</strong><br><br>' + esc(err.message) + '<br><br>' +
      'This app reads <code>accounts/*.json</code> directly and needs a directory listing to discover them — serve this folder with <code>python3 -m http.server</code> (same as the QBR Configurator), not by opening the file directly.'
    );
  }
}
window.addEventListener('hashchange', () => { cachedAccounts = cachedAccounts; route(); });
route();
