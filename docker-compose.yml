# docker-compose.yml — Mirantis QBR Template
# Run:    docker compose up --build
# Visit:  http://localhost:8080  (deck + configurator + SLA report)
#         http://localhost:8081  (sf-sync sidecar health)
# Stop:   docker compose down
#
# SF credentials: copy .env.example → .env and fill in before `docker compose up`.
# The sf-sync service won't start without a valid .env but the deck runs fine without it.
#
# SLA Performance Report reads ./accounts/*.json (gitignored). Both the nginx
# deck and sf-sync share that folder so a Salesforce pull appears in the report
# immediately — no copy step.

services:
  qbr:
    build: .
    image: mirantis-qbr-template:local
    container_name: mirantis-qbr
    ports:
      - "8080:8080"
    # accounts/ is bind-mounted, not baked into the image — the SLA Performance
    # Report reads accounts/*.json via nginx's directory listing (autoindex).
    # Configurator/Deck drafts still live in browser localStorage unless you
    # explicitly download JSON.
    volumes:
      - ./accounts:/usr/share/nginx/html/accounts:ro
    restart: unless-stopped

  sf-sync:
    build:
      context: .
      dockerfile: sf-sync/Dockerfile
    image: mirantis-qbr-sf-sync:local
    container_name: mirantis-qbr-sf-sync
    ports:
      - "8081:8081"
    env_file:
      - path: .env
        required: false   # stack still starts even without .env
    volumes:
      # Same host folder the SLA report reads — pull writes land here.
      - ./accounts:/data/accounts
    restart: unless-stopped
