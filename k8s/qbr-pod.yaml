# Originally generated by `kompose convert`, then hand-edited: the deck and the
# sf-sync sidecar are one pod with two containers so they can share the
# ReadWriteOnce sf-data claim (compose attaches one host folder to both
# services; a two-container pod is the same thing on Kubernetes). The separate
# sf-sync-pod.yaml this replaces is gone — re-running `kompose convert` will
# recreate the broken split layout, so re-apply this edit if you regenerate.
apiVersion: v1
kind: Pod
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: qbr
  name: qbr
spec:
  containers:
    - image: mirantis-qbr-template:local
      name: mirantis-qbr
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        # The image bakes no accounts/ directory; the mount creates the path and
        # nginx autoindex serves it even while the volume is still empty.
        - mountPath: /usr/share/nginx/html/accounts
          name: sf-data
          readOnly: true
    - envFrom:
        # Non-secret defaults, then credentials from the Secret (later entries
        # win, so .env values override the ConfigMap).
        - configMapRef:
            name: env
        - secretRef:
            name: mirantis-qbr-sf-sync-env
            optional: true
      image: mirantis-qbr-sf-sync:local
      name: mirantis-qbr-sf-sync
      ports:
        - containerPort: 8081
          protocol: TCP
      volumeMounts:
        - mountPath: /data/accounts
          name: sf-data
  # Both containers are long-running services, so a crash must be restarted.
  restartPolicy: Always
  volumes:
    - name: sf-data
      persistentVolumeClaim:
        claimName: sf-data
